services:
  c-vis:
    build: .
    ports:
      - "4173:4173"
    tmpfs:
      - /workspace/projects
    environment:
      CVIS_WORKSPACE_ROOT: /workspace/projects
      CVIS_TRACE_LIMIT: "${CVIS_TRACE_LIMIT:-5000}"
      CVIS_GDB_STOP_TIMEOUT_MS: "${CVIS_GDB_STOP_TIMEOUT_MS:-30000}"
      CVIS_MAX_UPLOAD_BYTES: "${CVIS_MAX_UPLOAD_BYTES:-36700160}"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
