name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Node tests
        run: npm test
      - name: Server syntax
        run: |
          node --check server/index.js
          node --check server/gdb-client.js
          node --check server/project.js
          node --check server/observability.js
      - name: GDB adapter syntax
        run: python3 -m py_compile server/gdb/push_swap.py
      - name: Svelte production build
        run: npm run build
      - name: Docker image build
        run: docker build -t c-vis-ci .
      - name: End-to-end native execution
        run: |
          docker run -d --name c-vis-ci-run \
            -p 4173:4173 \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            c-vis-ci
          trap 'docker logs c-vis-ci-run || true; docker rm -f c-vis-ci-run || true' EXIT
          bash test/integration.sh
