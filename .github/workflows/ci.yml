name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install native debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
      - name: Node tests
        run: npm test
      - name: Server syntax
        run: |
          node --check server/index.js
          node --check server/gdb-client.js
          node --check server/project.js
          node --check server/observability.js
      - name: GDB adapter syntax
        run: python3 -m py_compile server/gdb/push_swap.py
      - name: Svelte production build
        run: npm run build
      - name: Native Linux launcher check
        run: npm run linux:check
      - name: Native Linux end-to-end execution
        run: |
          PORT=4174 CVIS_SKIP_BUILD=1 bash scripts/run-linux.sh > /tmp/cvis-native.log 2>&1 &
          native_pid=$!
          trap 'cat /tmp/cvis-native.log || true; kill "$native_pid" 2>/dev/null || true; wait "$native_pid" 2>/dev/null || true' EXIT
          CVIS_BASE_URL=http://127.0.0.1:4174 bash test/integration.sh
      - name: Docker image build
        run: docker build -t c-vis-ci .
      - name: Docker end-to-end execution
        run: |
          docker run -d --name c-vis-ci-run \
            -p 4173:4173 \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            c-vis-ci
          trap 'docker logs c-vis-ci-run || true; docker rm -f c-vis-ci-run || true' EXIT
          bash test/integration.sh
