name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Node tests
        run: npm test
      - name: Server syntax
        run: |
          node --check server/index.js
          node --check server/gdb-client.js
          node --check server/project.js
          node --check server/observability.js
      - name: GDB adapter syntax
        run: python3 -m py_compile server/gdb/push_swap.py
      - name: Svelte production build
        run: npm run build
      - name: Docker image build
        run: docker build -t c-vis-ci .
